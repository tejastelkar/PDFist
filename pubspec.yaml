name: pdfist
description: "PDFist — an offline PDF toolkit for Android."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1

  # Navigation
  go_router: ^17.2.3

  # Firebase (enabled only when kFirebaseEnabled = true in app_config.dart)
  firebase_core: ^4.7.0
  firebase_auth: ^6.4.0
  cloud_firestore: ^6.3.0
  google_sign_in: ^7.2.0

  # PDF engine
  syncfusion_flutter_pdf: ^33.2.5
  pdfrx: ^2.3.1

  # File I/O
  file_picker: ^11.0.2
  path_provider: ^2.1.5
  share_plus: ^12.0.2
  path: ^1.9.1

  # State management
  flutter_riverpod: ^3.3.1

  # Local storage
  hive_flutter: ^1.1.0

  # WebView
  webview_flutter: ^4.13.1

  # OCR
  google_mlkit_text_recognition: ^0.15.1

  # Image processing
  image: ^4.8.0

  # Permissions
  permission_handler: ^12.0.1

  # .docx / .xlsx generation (ZIP + XML)
  archive: ^4.0.9

  # QR code generation (pure Dart)
  qr: ^3.0.1

  # Markdown parsing
  markdown: ^7.2.2

  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  path_provider_platform_interface: ^2.1.2
  plugin_platform_interface: ^2.1.8

flutter:
  uses-material-design: true

  assets:
    - assets/webview/
